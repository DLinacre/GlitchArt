<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="magentaGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="1" />
      <stop offset="100%" stop-color="#B000FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- HUD Grid Pattern -->
    <pattern id="hudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.12" />
      <circle cx="40" cy="40" r="1" fill="#00F0FF" opacity="0.25" />
    </pattern>

    <!-- Scanline Overlay -->
    <pattern id="scanlines" width="10" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#00F0FF" stroke-width="0.4" opacity="0.08" />
    </pattern>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonMagentaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="250" fill="#00F0FF" opacity="0.08" filter="blur(40px)" />
  <circle cx="1050" cy="320" r="280" fill="#FF0055" opacity="0.08" filter="blur(50px)" />
  <circle cx="600" cy="200" r="200" fill="#B000FF" opacity="0.05" filter="blur(40px)" />

  <!-- Grid & Scanline Layers -->
  <rect width="1200" height="400" fill="url(#hudGrid)" />
  <rect width="1200" height="400" fill="url(#scanlines)" />

  <!-- Outer HUD Framing Brackets -->
  <rect x="20" y="20" width="1160" height="360" rx="20" fill="none" stroke="#1E293B" stroke-width="2" />
  <rect x="20" y="20" width="1160" height="360" rx="20" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.3" />

  <!-- Corner Tech Accent Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00F0FF" stroke-width="4" filter="url(#neonCyanGlow)" />
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#00F0FF" stroke-width="4" filter="url(#neonCyanGlow)" />
  <path d="M 20 350 L 20 380 L 50 380" fill="none" stroke="#FF0055" stroke-width="4" filter="url(#neonMagentaGlow)" />
  <path d="M 1180 350 L 1180 380 L 1150 380" fill="none" stroke="#FF0055" stroke-width="4" filter="url(#neonMagentaGlow)" />

  <!-- Top Telemetry Header Bar -->
  <rect x="40" y="40" width="1120" height="36" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="60" cy="58" r="5" fill="#EF4444" />
  <circle cx="76" cy="58" r="5" fill="#F59E0B" />
  <circle cx="92" cy="58" r="5" fill="#10B981" />
  <text x="115" y="62" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00F0FF" opacity="0.9">linacre.site // BRAND ASSET STUDIO v2.5.0</text>
  <text x="1000" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981" font-weight="bold" text-anchor="end">● GITHUB OAUTH ACTIVE</text>

  <!-- Left Hero Typography & Subtitle -->
  <g transform="translate(60, 140)">
    <!-- Glitch Offset Shadow Text -->
    <text x="3" y="0" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="40" fill="#FF0055" opacity="0.7">LINACRE BRAND STUDIO</text>
    <text x="-3" y="0" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="40" fill="#00F0FF" opacity="0.7">LINACRE BRAND STUDIO</text>
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="40" fill="#FFFFFF">LINACRE BRAND STUDIO</text>

    <!-- Secondary Heading -->
    <text x="0" y="36" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#38BDF8">
      Cyber Glitch Vector Generator &amp; GitHub Repository Sync
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="68" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94A3B8">
      Automated multi-option repo artwork, 🎨_folder architecture, and Gemini AI theme audio tracks.
    </text>

    <!-- Terminal Command Snippet -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="560" height="42" rx="10" fill="#04060C" stroke="#00F0FF" stroke-width="1" opacity="0.9" />
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00FF66">$ git commit -m "style: insta-applied vector branding [skip ci]"</text>
    </g>
  </g>

  <!-- Right Side Interactive Theme Cards Showcase -->
  <g transform="translate(720, 105)">
    <!-- Card 1: Minimalist -->
    <rect x="0" y="0" width="420" height="68" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="30" cy="34" r="14" fill="#38BDF8" opacity="0.2" stroke="#38BDF8" stroke-width="2" />
    <text x="30" y="38" font-family="monospace" font-weight="bold" font-size="12" fill="#38BDF8" text-anchor="middle">MIN</text>
    <text x="60" y="30" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13" fill="#FFFFFF">Minimalist Profile Themes</text>
    <text x="60" y="48" font-family="sans-serif" font-size="11" fill="#94A3B8">Stealth White, Nordic Slate &amp; Zen Monograms</text>

    <!-- Card 2: Technical -->
    <rect x="0" y="80" width="420" height="68" rx="14" fill="#0F172A" stroke="#00FF66" stroke-width="1.5" />
    <circle cx="30" cy="114" r="14" fill="#00FF66" opacity="0.2" stroke="#00FF66" stroke-width="2" />
    <text x="30" y="118" font-family="monospace" font-weight="bold" font-size="12" fill="#00FF66" text-anchor="middle">TECH</text>
    <text x="60" y="110" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13" fill="#FFFFFF">Technical &amp; Hacker Presets</text>
    <text x="60" y="128" font-family="sans-serif" font-size="11" fill="#94A3B8">Terminal Matrix, Cyber Cyan HUD &amp; CAD Blueprints</text>

    <!-- Card 3: Creative -->
    <rect x="0" y="160" width="420" height="68" rx="14" fill="#0F172A" stroke="#B000FF" stroke-width="1.5" />
    <circle cx="30" cy="194" r="14" fill="#B000FF" opacity="0.2" stroke="#B000FF" stroke-width="2" />
    <text x="30" y="198" font-family="monospace" font-weight="bold" font-size="12" fill="#FF0055" text-anchor="middle">ARTS</text>
    <text x="60" y="190" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="13" fill="#FFFFFF">Creative &amp; Synthwave Styles</text>
    <text x="60" y="208" font-family="sans-serif" font-size="11" fill="#94A3B8">Vaporwave Sunset, Volcanic Magma &amp; Toxic Lime</text>
  </g>

  <!-- Bottom Technology Pill Badges Row -->
  <g transform="translate(60, 335)">
    <!-- Badge 1: React 18 -->
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#0F172A" stroke="#00F0FF" stroke-width="1" />
    <text x="60" y="18" font-family="monospace" font-weight="bold" font-size="11" fill="#00F0FF" text-anchor="middle">⚡ REACT 18</text>

    <!-- Badge 2: Vite -->
    <rect x="130" y="0" width="100" height="28" rx="14" fill="#0F172A" stroke="#B000FF" stroke-width="1" />
    <text x="180" y="18" font-family="monospace" font-weight="bold" font-size="11" fill="#B000FF" text-anchor="middle">🚀 VITE</text>

    <!-- Badge 3: TypeScript -->
    <rect x="240" y="0" width="130" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="305" y="18" font-family="monospace" font-weight="bold" font-size="11" fill="#38BDF8" text-anchor="middle">🔷 TYPESCRIPT</text>

    <!-- Badge 4: Gemini 2.5 -->
    <rect x="380" y="0" width="150" height="28" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="455" y="18" font-family="monospace" font-weight="bold" font-size="11" fill="#F59E0B" text-anchor="middle">✨ GEMINI API</text>

    <!-- Badge 5: WebAudio Synth -->
    <rect x="540" y="0" width="160" height="28" rx="14" fill="#0F172A" stroke="#00FF66" stroke-width="1" />
    <text x="620" y="18" font-family="monospace" font-weight="bold" font-size="11" fill="#00FF66" text-anchor="middle">🎵 WEBAUDIO SYNTH</text>

    <!-- Badge 6: 🎨_folder -->
    <rect x="710" y="0" width="160" height="28" rx="14" fill="#0F172A" stroke="#FF0055" stroke-width="1" />
    <text x="790" y="18" font-family="monospace" font-weight="bold" font-size="11" fill="#FF0055" text-anchor="middle">🎨_FOLDER READY</text>
  </g>

  <!-- Right Decorative Glitch Grid Element -->
  <g transform="translate(1120, 320)">
    <rect x="0" y="0" width="40" height="40" fill="#00F0FF" opacity="0.2" />
    <rect x="10" y="10" width="20" height="20" fill="#FF0055" opacity="0.4" />
  </g>
</svg>
